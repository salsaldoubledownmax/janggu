<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장구 연주</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ───────── 디자인 토큰 (DESIGN-apple.md) ───────── */
:root{
  --primary:#0066cc; --primary-focus:#0071e3; --primary-on-dark:#2997ff;
  --ink:#1d1d1f; --on-dark:#ffffff; --body-muted:#cccccc;
  --ink-80:#333333; --ink-48:#7a7a7a;
  --divider-soft:#f0f0f0; --hairline:#e0e0e0;
  --canvas:#ffffff; --parchment:#f5f5f7; --pearl:#fafafc;
  --tile-1:#272729; --black:#000000; --chip:rgba(210,210,215,.64);
  --r-sm:.5rem; --r-md:.6875rem; --r-lg:1.125rem; --pill:9999px;
  --font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
/* TV 크기 보정: 1280px에서 16px → 1920px에서 24px */
html{font-size:clamp(14px,min(1.25vw,2.22vh),30px)}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;
  background:var(--tile-1);color:var(--ink);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
}
button,select,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
button:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100%}

/* ───────── 상단바 ───────── */
.nav{
  flex:0 0 auto;height:2.75rem;background:var(--black);color:var(--on-dark);
  display:flex;align-items:center;justify-content:flex-end;padding:0 1.5rem;
}
.nav-links{display:flex;align-items:center;gap:.5rem}
.nav-btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--on-dark);opacity:.88;
  font-size:.8rem;padding:.45rem .8rem;border-radius:var(--r-sm);
}
.nav-btn svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.fs .nav{display:none}

/* ───────── 연주 무대 (어두운 타일) ───────── */
.stage{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  padding:1.1rem 1rem .2rem;background:var(--tile-1);color:var(--on-dark);
}
.stage h1{margin:0;font-size:2.5rem;font-weight:600;line-height:1.1;letter-spacing:-.02em;text-align:center}
.stage .sub{margin:.45rem 0 0;font-size:1.05rem;color:var(--body-muted);letter-spacing:-.01em}
.jg-wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:.4rem 0 .3rem}
#janggu{width:100%;height:100%;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
#janggu .drum{filter:drop-shadow(3px 5px 30px rgba(0,0,0,.22))}
#janggu .head{cursor:pointer;transform-box:fill-box;transform-origin:center}
#janggu .head .flash{opacity:0;pointer-events:none}
#janggu .head.hit{animation:headHit .28s cubic-bezier(.2,.8,.2,1)}
#janggu .head.hit .flash{animation:headFlash .4s ease-out}
@keyframes headHit{0%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes headFlash{0%{opacity:.45}100%{opacity:0}}
#janggu .stick{pointer-events:none}

/* ───────── 하단 악보바 (반투명 + 흐림) ───────── */
.dock{
  flex:0 0 auto;position:relative;z-index:2;height:8.6rem;
  display:flex;align-items:center;gap:1.5rem;padding:0 1.5rem 0 2rem;
  background:rgba(245,245,247,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
}
.score{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:.25rem;padding:.4rem 0 .55rem}
#strip{
  position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:.6rem;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap;padding:0 .5rem;
  cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none;
}
#strip::-webkit-scrollbar{display:none}
#strip.dragging{cursor:grabbing}
#strip .jc{cursor:pointer}
#strip.dragging .jc{cursor:grabbing}
#stripSlider{-webkit-appearance:none;appearance:none;width:100%;height:1.1rem;margin:0;background:transparent;cursor:pointer}
#stripSlider[hidden]{display:block;visibility:hidden}
#stripSlider::-webkit-slider-runnable-track{height:.3rem;border-radius:var(--pill);background:rgba(0,0,0,.12)}
#stripSlider::-moz-range-track{height:.3rem;border-radius:var(--pill);background:rgba(0,0,0,.12)}
#stripSlider::-webkit-slider-thumb{-webkit-appearance:none;width:3.2rem;height:1rem;margin-top:-.35rem;border:0;border-radius:var(--pill);background:var(--primary)}
#stripSlider::-moz-range-thumb{width:3.2rem;height:1rem;border:0;border-radius:var(--pill);background:var(--primary)}
.empty{font-size:1.05rem;color:var(--ink-48)}
/* 정간 칸: 장단 = 큰 상자, 박 = 진한 세로선, 칸 = 옅은 세로선 */
.jd{flex:0 0 auto;display:inline-flex;height:6rem;border:2px solid rgba(0,0,0,.3);border-radius:var(--r-sm);background:rgba(255,255,255,.5);overflow:hidden}
.jc{
  position:relative;flex:0 0 auto;width:4.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;
  border-left:1px solid rgba(0,0,0,.12);color:var(--ink);
}
.jc:first-child{border-left:0}
.jc.bs{border-left:2px solid rgba(0,0,0,.42)}
.jc .sy{display:flex;align-items:center;justify-content:center;height:2.5rem}
.jc .sy svg{width:2.5rem;height:2.5rem;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.jc .sy.two svg{width:1.7rem}
.jc .lb{font-size:1.3rem;font-weight:400;line-height:1;letter-spacing:-.02em}
.jc .lb.long{font-size:.92rem;letter-spacing:-.05em}
.jc.acc .sy svg{stroke-width:4.8}
.jc.acc .lb{font-weight:700}
.jc .sy svg.soft{transform:scale(.7);opacity:.55}
.jc .sy svg.loud{transform:scale(1.2)}
.jc .lb .soft{font-size:.72em;opacity:.55}
.jc .lb .loud{font-size:1.2em;font-weight:700}
.jc.now{background:var(--canvas);box-shadow:inset 0 0 0 3px var(--primary-focus)}
.jc.past{opacity:.35}

.ctrls{flex:0 0 auto;display:flex;align-items:center;gap:.7rem}
.btn-pearl{
  display:inline-flex;align-items:center;justify-content:center;min-width:3.4rem;min-height:3.2rem;
  background:var(--pearl);color:var(--ink-80);border:3px solid var(--divider-soft);border-radius:var(--r-md);
  padding:.4rem .8rem;font-size:1.5rem;line-height:1;
}
.btn-play{
  display:inline-flex;align-items:center;justify-content:center;width:5.2rem;height:3.6rem;
  background:transparent;color:var(--ink);border:2px solid var(--primary);border-radius:var(--pill);
  transition:background-color .2s ease,color .2s ease,transform .12s ease;
}
.btn-play svg{width:1.35rem;height:1.35rem;fill:currentColor}
.btn-play:hover,.btn-play:focus-visible,.btn-play.playing{background:var(--primary);color:#fff}
.btn-primary{
  display:inline-flex;align-items:center;gap:.55rem;min-height:3rem;
  background:var(--primary);color:#fff;border:0;border-radius:var(--pill);
  padding:.7rem 1.6rem;font-size:1.05rem;font-weight:400;letter-spacing:-.01em;
}

/* ───────── 편집 패널 (밝은 타일, 옆에서 천천히 밀려 나옴) ───────── */
.scrim{
  position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
  transition:opacity .6s cubic-bezier(.4,0,.2,1) .1s;
}
.scrim.open{opacity:1;pointer-events:auto;transition:opacity .7s cubic-bezier(.32,.72,0,1)}
.panel{
  position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(34rem,94vw);
  display:flex;flex-direction:column;background:var(--parchment);color:var(--ink);
  transform:translateX(100%);visibility:hidden;will-change:transform;
  transition:transform .6s cubic-bezier(.4,0,.2,1) .1s,visibility 0s linear .72s;
}
.panel.open{transform:none;visibility:visible;transition:transform .7s cubic-bezier(.32,.72,0,1),visibility 0s}
.panel .inner{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;opacity:0;transition:opacity .2s ease}
.panel.open .inner{opacity:1;transition:opacity .4s ease .25s}
@media (prefers-reduced-motion: reduce){
  .panel,.panel.open{transform:none;transition:opacity .3s ease,visibility 0s linear .3s;opacity:0}
  .panel.open{opacity:1;transition:opacity .3s ease,visibility 0s}
  .panel .inner,.panel.open .inner{transition:none;opacity:1}
}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:1.3rem 1.5rem .5rem}
.panel h2{margin:0;font-size:1.7rem;font-weight:600;letter-spacing:-.02em}
.icon-btn{width:2.75rem;height:2.75rem;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:1.1rem;display:grid;place-items:center}
.panel .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:.3rem 1.5rem 1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);
  border-radius:var(--pill);padding:.55rem 1rem;font-size:.875rem;
}
.chip.on{border:2px solid var(--primary-focus);padding:calc(.55rem - 1px) calc(1rem - 1px)}
.chip.add{color:var(--primary)}
.card{margin-top:1rem;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:1.1rem 1.2rem}
.field{
  font-size:1rem;line-height:1.47;color:var(--ink);
  background:var(--canvas);border:1px solid rgba(0,0,0,.12);border-radius:var(--r-sm);padding:.45rem .7rem;
}
.settings{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.4rem}
.settings label{display:flex;align-items:center;gap:.6rem;font-size:.95rem}
.settings .title-in{width:15rem}
.seg{display:inline-flex;gap:.35rem}
.seg button{border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);border-radius:var(--pill);padding:.4rem .85rem;font-size:.875rem}
.seg button.on{border:2px solid var(--primary-focus);padding:calc(.4rem - 1px) calc(.85rem - 1px)}
input[type=range]{accent-color:var(--primary)}
.link{background:none;border:0;padding:.2rem 0;color:var(--primary);font-size:.95rem}

/* 정간 칸 (세로로 쌓고, 칸 폭은 패널에 맞춤) */
.grid{display:flex;flex-direction:column;gap:.8rem}
.grow{display:flex;gap:.35rem}
.ms{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.mnum{font-size:.7rem;color:var(--ink-48);padding-left:.15rem;white-space:nowrap;overflow:hidden}
.mcells{display:flex;border:1px solid rgba(0,0,0,.18);border-radius:var(--r-sm);background:var(--canvas)}
.filler{min-width:0}
.cell{position:relative;flex:1 1 0;min-width:0;height:3.4rem;border-left:1px solid var(--divider-soft)}
.cell:first-child{border-left:0}
.cell.bs{border-left:2px solid rgba(0,0,0,.35)}
.cell input{
  display:block;width:100%;height:100%;border:0;background:transparent;padding:0 .1rem;
  text-align:center;font-size:1.05rem;font-weight:600;color:var(--ink);border-radius:var(--r-sm);
}
.cell input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--primary-focus)}
.cell.multi input{font-size:.72rem;letter-spacing:-.06em}
.cell.bad input{color:var(--ink-48);opacity:.55}
.cell .edge{position:absolute;top:0;bottom:0;width:9px;z-index:2;cursor:pointer}
.cell .edge.l{left:-5px}
.cell .edge.r{right:-5px}
.cell .edge:hover::after{content:"";position:absolute;top:.2rem;bottom:.2rem;left:3px;width:3px;border-radius:2px;background:var(--primary)}

.set{display:flex;align-items:center;gap:1rem;min-height:3rem}
.set+.set{border-top:1px solid var(--divider-soft)}
.set>span{flex:1 1 auto;font-size:1rem}
.set input[type=range]{flex:0 1 12rem}
.set b{width:2.6rem;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.switch{position:relative;width:2.9rem;height:1.75rem;border:0;border-radius:var(--pill);background:#d2d2d7;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;transition:transform .2s ease}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(1.15rem)}
.panel footer{padding:.9rem 1.5rem 1.3rem;display:flex;justify-content:flex-end}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="nav-links">
      <button class="nav-btn" id="btnEdit">편집</button>
      <button class="nav-btn" id="btnFull" aria-label="전체화면"></button>
    </div>
  </nav>

  <main class="stage">
    <h1 id="songTitle"></h1>
    <p class="sub" id="songSub"></p>
    <div class="jg-wrap"><svg id="janggu" role="img" aria-label="장구"></svg></div>
  </main>

  <footer class="dock">
    <div class="score">
      <div id="strip" aria-live="off"></div>
      <input type="range" id="stripSlider" min="0" max="1000" value="0" aria-label="악보 이동">
    </div>
    <div class="ctrls">
      <button class="btn-pearl" id="btnStop" aria-label="중지">■</button>
      <button class="btn-play" id="btnPlay"></button>
    </div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true">
 <div class="inner">
  <header>
    <h2>편집</h2>
    <button class="icon-btn" id="btnClose" aria-label="닫기">✕</button>
  </header>
  <div class="scroll">
    <div class="chips" id="chips"></div>

    <section class="card">
      <div class="settings">
        <label>제목 <input class="field title-in" id="titleIn" type="text" autocomplete="off"></label>
        <label>한 박 <span class="seg" id="segSub"></span></label>
        <label>한 장단 <select class="field" id="beatsSel"></select></label>
        <label>한 줄 <select class="field" id="perLineSel"></select></label>
        <label>빠르기 <input type="range" id="tempo" min="20" max="160" step="1"><b id="tempoVal">60</b></label>
      </div>
    </section>

    <section class="card">
      <div class="grid" id="grid"></div>
    </section>

    <section class="card">
      <div class="set"><span>메트로놈</span><span class="seg" id="segMetro">
        <button data-m="off">끔</button><button data-m="empty">빈 박만</button>
      </span></div>
      <div class="set"><span>메트로놈 크기</span><input type="range" id="metroVol" min="0" max="100" step="5"><b id="metroVolVal">70</b></div>
      <div class="set"><span>예비박</span><button class="switch" id="swCount" role="switch" aria-label="예비박"></button></div>
      <div class="set"><span>반복 재생</span><button class="switch" id="swLoop" role="switch" aria-label="반복 재생"></button></div>
    </section>

    <section class="card">
      <div class="set"><span>내 장단 파일로</span>
        <button class="link" id="btnExport">내보내기</button>
        <button class="link" id="btnImport">가져오기</button>
        <input type="file" id="fileIn" accept=".json,application/json" hidden>
      </div>
      <div class="set"><span>지금 장단</span><button class="link" id="btnDelete">이 장단 지우기</button></div>
    </section>
  </div>
  <footer><button class="btn-primary" id="btnApply">적용하고 닫기</button></footer>
 </div>
</aside>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ═════════ 1. 구음 ═════════
   쿵 = 북편(궁채), 덕 = 채편(열채), 덩 = 양편, 기덕 = 꾸밈+덕, 더러러러 = 굴림, 더 = 약한 덕 (덕더)
   따 = 학생용 구음, 덕과 같은 소리 */
const STROKES = ['더러러러', '기덕', '덩', '쿵', '덕', '따', '더'];

// 칸 하나 해석: 구음 1~4개를 칸 안에서 똑같이 나눔
// 셈여림: (쿵) = 작게, 쿵! = 크게, 표시 없음 = 보통 → unit.dyn = -1 / 0 / 1
const cellCache = new Map();
function parseCell(text) {
  const key = (text || '').replace(/\s+/g, '');
  if (cellCache.has(key)) return cellCache.get(key);
  const res = { units: [], bad: false, empty: key === '' };
  let i = 0, open = false, inParen = 0;
  while (i < key.length) {
    const ch = key[i];
    if (ch === '(' || ch === '（') {
      if (open) { res.bad = true; break; }
      open = true; inParen = 0; i++; continue;
    }
    if (ch === ')' || ch === '）') {
      if (!open || !inParen) { res.bad = true; break; }
      open = false; i++; continue;
    }
    if (ch === '!' || ch === '！') {
      const u = res.units[res.units.length - 1];
      if (!u || u.dyn !== 0) { res.bad = true; break; }
      u.dyn = 1; i++; continue;
    }
    const s = STROKES.find(w => key.startsWith(w, i));
    if (!s) { res.bad = true; break; }
    res.units.push({ k: s, dyn: open ? -1 : 0 });
    if (open) inParen++;
    i += s.length;
  }
  if (open) res.bad = true;
  if (!res.empty && (res.bad || res.units.length === 0 || res.units.length > 4)) { res.bad = true; res.units = []; }
  cellCache.set(key, res);
  return res;
}

/* ═════════ 2. 기본 장단 원본 (코드에 고정) ═════════
   빠르기 = 한 박(구분선 사이) 기준, 참고 사이트 녹음의 칸 길이에서 계산 */
const PRESET_DEFS = [
  { id: 'semachi', title: '세마치장단', sub: 3, beats: 3, tempo: 74,
    cells: ['덩', '', '', '덩', '', '덕', '쿵', '덕', ''] },
  { id: 'jajin1', title: '자진모리장단 ①', sub: 3, beats: 4, tempo: 67,
    cells: ['덩', '', '', '쿵', '', '', '쿵', '', '덕', '쿵', '', ''] },
  { id: 'jajin2', title: '자진모리장단 ②', sub: 3, beats: 4, tempo: 69,
    cells: ['덩', '', '덕', '쿵', '덕', '', '쿵', '', '덕', '쿵', '덕', ''] },
  { id: 'gutgeori', title: '굿거리장단', sub: 3, beats: 4, tempo: 38,
    cells: ['덩', '', '기덕', '쿵', '더러러러', '', '쿵', '', '기덕', '쿵', '더러러러', ''] },
  { id: 'jungjung', title: '중중모리장단', sub: 3, beats: 4, tempo: 39,
    cells: ['덩', '', '덕', '쿵', '덕', '덕', '쿵', '쿵', '덕', '쿵', '', '쿵'] },
  { id: 'jungmori', title: '중모리장단', sub: 3, beats: 4, tempo: 21,
    cells: ['덩', '', '덕', '쿵', '덕더', '덕덕', '쿵', '쿵', '덕', '쿵', '덕더', '덕덕'] }
];
// 교육과정발표회 연주곡 (판서 기준, 2분박 4박: 한 박 = 2칸)
const rep = (bar, n) => Array.from({ length: n }, () => bar).flat();
const SHOW_BAR6 = ['쿵', '따', '쿵', '따', '쿵', '따', '쿵', '따'];
// 휘모리 관습: 이 칸들은 궁채도 채편으로 넘겨 침 (쿵 → 궁채로 채편). [몇 번째 장단부터, 장단 안 칸 번호] × 4장단
const SHOW_OVER = [[0, [4, 5, 6]], [4, [2, 3, 4, 5, 6]], [8, [4, 5, 6]], [12, [4, 5, 6]], [16, [4, 5, 6]], [20, [4, 5, 6, 7]]]
  .flatMap(([b, ks]) => [0, 1, 2, 3].flatMap(r => ks.map(k => (b + r) * 8 + k)));
// rev: 원본을 고치면 올림 → 저장된 예전 원본의 칸을 새 원본으로 바꿈 (빠르기는 유지)

    ...rep(['쿵', '따', '따', '따', '쿵', '따', '쿵', ''], 4), // ④ 쿵따 따따 쿵따 쿵
    ...rep(['쿵', '따', '쿵', '', '쿵', '따', '쿵', ''], 4),   // ⑤ 쿵따 쿵 쿵따 쿵

// 휘모리 1 (2026-10-28): 다 치면 휘모리 2로 이어짐 (next). 쿵따쿵은 모두 채편으로 넘겨 침
// 셈여림은 3단계로: 매우 작게 → 작게 (덩), 조금 크게 → 보통 덩, 크게 → 덩!

  ] });
const presetSong = d => ({ id: d.id, rev: d.rev || 1, title: d.title, sub: d.sub, beats: d.beats, tempo: d.tempo, perLine: d.perLine || 1, cells: d.cells.slice(), over: d.over ? d.over.slice() : undefined, next: d.next });

/* ═════════ 3. 저장 ═════════ */
const STORE_KEY = 'janggu.v1';
const newId = () => 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const defaultState = () => ({ v: 1, songs: [], removed: [], cur: 'semachi', loop: false, metro: { mode: 'empty', vol: 70, countIn: true } });
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const validSong = s => s && typeof s.title === 'string' && [2, 3].includes(s.sub)
  && Number.isInteger(s.beats) && s.beats >= 2 && s.beats <= 12 && Array.isArray(s.cells);

function loadState() {
  let s = readJSON(STORE_KEY);
  if (s && s.v === 1) {
    s = Object.assign(defaultState(), s);
    s.metro = Object.assign(defaultState().metro, s.metro || {});
    if (!['off', 'empty'].includes(s.metro.mode)) s.metro.mode = 'empty';
    s.songs = (s.songs || []).filter(validSong);
  } else s = defaultState();
  // 원본이 새로 고쳐진 기본 장단은 칸·박 구성을 새 원본으로 (빠르기는 그대로)
  for (const d of PRESET_DEFS) {
    const old = s.songs.find(x => x.id === d.id);
    if (old && (old.rev || 1) < (d.rev || 1)) Object.assign(old, presetSong(d), { tempo: old.tempo });
  }
  // 기본 장단이 없으면 원본으로 채움 (지운 장단은 다시 넣지 않음)
  PRESET_DEFS.slice().reverse().forEach(d => {
    if (!s.songs.some(x => x.id === d.id) && !s.removed.includes(d.id)) s.songs.unshift(presetSong(d));
  });
  if (!s.songs.length) s.songs.push(blankSong());
  if (!s.songs.some(x => x.id === s.cur)) s.cur = s.songs[0].id;
  return s;
}
function blankSong() {
  return { id: newId(), title: '새 장단', sub: 3, beats: 4, tempo: 60, perLine: 1, cells: Array(12).fill('') };
}
const state = loadState();
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }, 200);
}
function curSong() { return state.songs.find(s => s.id === state.cur) || state.songs[0]; }

/* ═════════ 4. 칸 → 연주 목록 (시간 단위 = 칸) ═════════ */
const cycleLen = s => s.sub * s.beats;

function build(song) {
  const events = [], cells = [], beats = [];
  const L = cycleLen(song);
  song.cells.forEach((text, i) => {
    const c = parseCell(text);
    const cell = { i, start: i, dur: 1, units: c.bad ? [] : c.units, bad: c.bad, text,
      acc: i % L === 0, beatStart: i % song.sub === 0, cycleStart: i % L === 0 };
    cells.push(cell);
    if (cell.beatStart) beats.push({ b: i, hasStroke: cell.units.length > 0 });
    const n = cell.units.length;
    cell.units.forEach((u, k) => events.push({ kind: u.k, dyn: u.dyn, start: i + k / n, dur: 1 / n, cell }));
  });
  // 따를 반 박 안에 연달아 치면 열채 → 궁채 → 열채 … 번갈아 (아이들이 치는 방법)
  const CHAE = ['따', '덕', '더'];
  // 궁채를 채편으로 넘겨 치는 칸 (휘모리 2). 이 목록이 있는 장단은 그 칸의 쿵만 궁채가 넘어가 치고, 따는 늘 열채
  const over = song.over ? new Set(song.over) : null;
  let prev = null;
  for (const e of events) {
    e.cross = e.kind === '쿵' ? !!over && over.has(e.cell.i) : !!(e.kind === '따' && !over
      && prev && CHAE.includes(prev.kind)
      && e.start - prev.start <= song.sub / 2 + 1e-6 && !prev.cross);
    prev = e;
  }
  return { events, cells, beats, total: song.cells.length };
}

/* ═════════ 5. 장구 그리기 (SVG) ═════════ */
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const svg = $('janggu');
const CY = 430;
// 장구 길이 줄임: 가운데(800)를 기준으로 가로만 줄여 실제 장구 비율(테 포함 길이 ≈ 가죽 지름의 1.75배)에 맞춤
const LEN_K = 0.68;
const JX = x => 800 + (x - 800) * LEN_K;
const HEAD = { L: { cx: JX(205), leather: '#C9B48A' }, R: { cx: JX(1395), leather: '#D6C59E' } };

function buildJanggu() {
  svg.setAttribute('viewBox', '60 -10 1480 810');
  // 화면이 세로로 길어도 장구를 아래에 붙여 채가 늘 화면 아래 가장자리에서 나오게 함
  svg.setAttribute('preserveAspectRatio', 'xMidYMax meet');
  const defs = sv('defs', {}, svg);
  const g = sv('linearGradient', { id: 'lacquer', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  sv('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': .16 }, g);
  sv('stop', { offset: .35, 'stop-color': '#fff', 'stop-opacity': .03 }, g);
  sv('stop', { offset: 1, 'stop-color': '#000', 'stop-opacity': .22 }, g);

  const drum = sv('g', { class: 'drum' }, svg);
  // 울림통 (가운데가 잘록한 모래시계 모양)
  const body = ('M215,215 C470,215 600,300 690,368 L910,368 C1000,300 1130,215 1385,215 ' +
               'L1385,645 C1130,645 1000,560 910,492 L690,492 C600,560 470,645 215,645 Z')
    .replace(/(\d+),(\d+)/g, (m, x, y) => `${JX(+x).toFixed(1)},${y}`);
  sv('path', { d: body, fill: '#B03034' }, drum);
  sv('path', { d: body, fill: 'url(#lacquer)' }, drum);
  for (const x of [JX(262), JX(1338)]) sv('line', { x1: x, y1: 222, x2: x, y2: 638, stroke: '#7A1F22', 'stroke-width': 12 }, drum);
  for (const x of [JX(761) - 9, JX(839) - 9]) sv('rect', { x, y: 362, width: 18, height: 136, rx: 4, fill: '#8E2427' }, drum);

  // 북편·채편
  for (const side of ['L', 'R']) {
    const h = HEAD[side];
    const hg = sv('g', { class: 'head' }, drum);
    sv('ellipse', { cx: h.cx, cy: CY, rx: 78, ry: 272, fill: '#E6CC92' }, hg);
    sv('ellipse', { cx: h.cx, cy: CY, rx: 64, ry: 256, fill: h.leather }, hg);
    sv('ellipse', { cx: h.cx, cy: CY, rx: 64, ry: 256, fill: '#fff', class: 'flash' }, hg);
    hg.addEventListener('pointerdown', e => { e.preventDefault(); liveHit(side); });
    h.el = hg;
  }

  // 조임줄 (지그재그) + 축수
  const ropes = sv('g', { 'pointer-events': 'none' }, drum);
  const Ly = [178, 302, 430, 558, 682], Ry = [240, 366, 494, 620];
  const pts = [];
  for (let k = 0; k < Ly.length; k++) {
    pts.push([JX(258), Ly[k]]);
    if (k < Ry.length) pts.push([JX(1342), Ry[k]]);
  }
  for (let k = 0; k < pts.length - 1; k++) {
    const [x1, y1] = pts[k], [x2, y2] = pts[k + 1];
    sv('line', { x1, y1, x2, y2, stroke: '#F4F1EA', 'stroke-width': 7, 'stroke-linecap': 'round' }, ropes);
    const rx = x1 < x2 ? x1 + (x2 - x1) * 0.72 : x2 + (x1 - x2) * 0.28;
    const ry = x1 < x2 ? y1 + (y2 - y1) * 0.72 : y2 + (y1 - y2) * 0.28;
    const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    sv('path', { d: 'M-34,-15 L34,-15 L26,15 L-26,15 Z', fill: '#333333',
      transform: `translate(${rx} ${ry}) rotate(${ang})` }, ropes);
  }
  for (const [x, y] of pts) sv('circle', { cx: x, cy: y, r: 7, fill: '#E9B949' }, ropes);

  buildSticks();
}

/* ═════════ 6. 채 동작 ═════════
   아이 시점: 장구를 위에서 내려다보고, 채는 화면 아래(내 손)에서 위쪽 가죽으로 뻗음
   궁채(왼손) = 북편, 열채(오른손) = 채편. 손목(축)을 중심으로 채 끝을 바깥으로 들었다 내려침
   따를 연달아 칠 때는 궁채가 몸통 위를 가로질러 채편으로 건너가 열채와 번갈아 침 (cross 자세) */
const toRot = (p, t) => Math.atan2(t[1] - p[1], t[0] - p[0]) * 180 / Math.PI - 90;
const POSE = {
  L: { tip: [402, 430], rot: toRot([517, 820], [402, 430]), dir: -1 },    // 북편 (왼쪽 아래 손)
  X: { tip: [1170, 470], rot: toRot([915, 790], [1170, 470]), dir: 1 },  // 채편 (궁채가 건너감)
  R: { tip: [1200, 430], rot: toRot([1082, 820], [1200, 430]), dir: 1 }   // 채편 (오른쪽 아래 손)
};
const sticks = {
  L: { len: Math.hypot(517 - 402, 820 - 430), strikes: [] },
  R: { len: Math.hypot(1082 - 1200, 820 - 430), strikes: [] }
};
const MAX_ANGLE = 34;
const LIFT_SCALE = 0.15; // 들 때 채가 눈 쪽으로 다가와 조금 커 보임
const VIEW_BOTTOM = 800; // viewBox 아래 끝 = 화면 아래 가장자리 (손은 그 밖)

// 채를 손목(0,0)에서 아래(+y)로 그려 두고, 자세에 따라 옮기고 돌림
function buildSticks() {
  // 손잡이 끝이 화면 아래 가장자리 밖으로 나가 보이지 않게 자름
  const cp = sv('clipPath', { id: 'stickClip', clipPathUnits: 'userSpaceOnUse' }, svg.querySelector('defs'));
  sv('rect', { x: -2000, y: -2000, width: 6000, height: 2000 + VIEW_BOTTOM }, cp);
  const layer = sv('g', { 'clip-path': 'url(#stickClip)' }, svg);
  for (const side of ['L', 'R']) {
    const S = sticks[side], L = S.len;
    S.g = sv('g', { class: 'stick' }, layer);
    if (side === 'L') {
      sv('line', { x1: 0, y1: -70, x2: 0, y2: L, stroke: '#9C7240', 'stroke-width': 18, 'stroke-linecap': 'round' }, S.g);
      sv('line', { x1: 0, y1: -70, x2: 0, y2: L, stroke: '#D9B98A', 'stroke-width': 13, 'stroke-linecap': 'round' }, S.g);
      sv('circle', { cx: 0, cy: L - 18, r: 30, fill: '#C99A5B', stroke: '#9C7240', 'stroke-width': 5 }, S.g);
    } else {
      sv('line', { x1: 0, y1: -70, x2: 0, y2: L, stroke: '#9C7240', 'stroke-width': 13, 'stroke-linecap': 'round' }, S.g);
      sv('line', { x1: 0, y1: -70, x2: 0, y2: L, stroke: '#E8D9A8', 'stroke-width': 8, 'stroke-linecap': 'round' }, S.g);
      for (const f of [0.3, 0.6]) sv('circle', { cx: 0, cy: L * (1 - f), r: 5.5, fill: '#CDB97F' }, S.g);
    }
  }
}

// 궁채가 북편(0) ↔ 채편(1) 사이 어디쯤 있는지
function crossBlend(S, t) {
  const a = S.strikes;
  let prev = null, next = null;
  for (let k = 0; k < a.length; k++) { if (a[k].t <= t) prev = a[k]; else { next = a[k]; break; } }
  const from = prev && prev.cross ? 1 : 0;
  // 채편을 친 뒤 다음 칠 것이 없으면 잠시 뒤 북편으로 돌아옴
  const to = next ? (next.cross ? 1 : 0) : 0;
  const arrive = next ? next.t : prev ? prev.t + 0.9 : t;
  if (from === to) return from;
  const td = Math.min(0.3, ((next ? next.t : arrive) - (prev ? prev.t : -1)) * 0.7);
  const e = clamp01((t - (arrive - td)) / td);
  const s = e < .5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  return from + (to - from) * s;
}

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

// 채 높이 h: 0 = 가죽에 닿음, 1 = 가장 높이 듦
function stickH(S, t) {
  const a = S.strikes;
  let prev = null, next = null;
  for (let k = 0; k < a.length; k++) { if (a[k].t <= t) prev = a[k]; else { next = a[k]; break; } }
  const HOV = 0.42, TAU = 0.045;
  const gap = prev && next ? next.t - prev.t : Infinity;
  let h = prev ? HOV * (1 - Math.exp(-(t - prev.t) / TAU)) : HOV;
  if (next) {
    const W = prev ? Math.min(0.28, gap * 0.8) : 0.28;
    const d = next.t - t;
    if (d < W) {
      const ph = 1 - d / W;
      const h0 = prev ? HOV * (1 - Math.exp(-(gap - W) / TAU)) : HOV;
      const peak = Math.max(h0, next.amp);
      h = ph < 0.55 ? h0 + (peak - h0) * Math.sin(ph / 0.55 * Math.PI / 2)
                    : peak * Math.cos((ph - 0.55) / 0.45 * Math.PI / 2);
    }
  }
  return h;
}

function drawStick(side, t) {
  const S = sticks[side], h = stickH(S, t);
  let p = POSE[side];
  if (side === 'L') {
    const b = crossBlend(S, t);
    if (b > 0) {
      const A = POSE.L, B = POSE.X, m = (u, v) => u + (v - u) * b;
      p = { tip: [m(A.tip[0], B.tip[0]), m(A.tip[1], B.tip[1])], rot: m(A.rot, B.rot), dir: m(A.dir, B.dir) };
    }
  }
  // 채끝(tip)이 가죽에 닿는 자세에서 손목 위치를 거꾸로 구함
  const r = (p.rot + 90) * Math.PI / 180;
  const px = p.tip[0] - S.len * Math.cos(r), py = p.tip[1] - S.len * Math.sin(r);
  S.g.setAttribute('transform', `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(p.rot + p.dir * MAX_ANGLE * h).toFixed(2)}) scale(${(1 + LIFT_SCALE * h).toFixed(3)})`);
}

let allStrikes = [];
// side = 어느 채, head = 어느 가죽 (궁채가 채편을 치면 side 'L', head 'R')
function addStrike(side, t, amp, head = side) {
  const s = { t, side, amp, head, cross: side === 'L' && head === 'R' };
  const a = sticks[side].strikes;
  a.push(s);
  if (a.length > 1 && a[a.length - 2].t > t) a.sort((p, q) => p.t - q.t);
  allStrikes.push(s);
}
function clearFutureStrikes(t) {
  for (const S of [sticks.L, sticks.R]) S.strikes = S.strikes.filter(s => s.t <= t);
  allStrikes = allStrikes.filter(s => s.t <= t);
}
function flashHead(side) {
  const g = HEAD[side].el;
  g.classList.remove('hit');
  void g.getBoundingClientRect();
  g.classList.add('hit');

      const step = Math.max(0.03, Math.min(0.075, dur * 0.75 / 4));
      [1, 0.7, 0.5, 0.38].forEach((a, k) => deok(t + k * step, a));
      break;
    }
  }
}

/* ═════════ 8. 재생 제어 ═════════ */
let TL = build(curSong());
const P = { playing: false, session: null, dry: null, spc: 1, passStart: 0, from: 0, endT: 0, nextPass: null, paused: 0 };

function newSessions() {
  P.session = ctx.createGain(); P.session.connect(bus);
  P.dry = ctx.createGain(); P.dry.connect(master);
}
function killSession() {
  for (const k of ['session', 'dry']) {
    const g = P[k]; if (!g) continue;
    P[k] = null;
    g.gain.setTargetAtTime(0, ctx.currentTime, 0.015);
    setTimeout(() => g.disconnect(), 400);
  }
}

function schedulePass(from, t0, tl = TL, spc = P.spc) {
  for (const e of tl.events) {
    if (e.start < from - 1e-6) continue;
    stroke(e.kind, t0 + (e.start - from) * spc, e.dur * spc, P.session, e.dyn, e.cross);
  }
  if (state.metro.mode === 'empty') {
    for (const bt of tl.beats) {
      if (bt.b < from - 1e-6 || bt.hasStroke) continue;
      tick(t0 + (bt.b - from) * spc, P.dry);
    }
  }
}

function play(from, opts = {}) {
  ensureAudio();
  if (!TL.events.length) return;
  if (!samplesLoaded) { samplesReady.then(() => play(from, opts)); return; }
  if (from >= TL.total - 1e-6) from = 0;
  killSession();
  clearFutureStrikes(vnow());
  const song = curSong();
  P.spc = 60 / song.tempo / song.sub;
  newSessions();
  let t0 = ctx.currentTime + 0.35;
  // 예비박: 한 장단의 박 수만큼 "삑"
  if (from < 1e-6 && state.metro.countIn && !opts.noCount) {
    const spb = 60 / song.tempo;
    for (let k = 0; k < song.beats; k++) tick(t0 + k * spb, P.dry);
    t0 += song.beats * spb;
  }
  schedulePass(from, t0);
  Object.assign(P, { playing: true, passStart: t0, from, endT: t0 + (TL.total - from) * P.spc, nextPass: null });
  syncButtons();
}

function currentPos(t) { return P.from + (t - P.passStart) / P.spc; }

function pause() {
  if (!P.playing) return;
  P.paused = Math.max(0, Math.min(TL.total, Math.floor(currentPos(vnow()) + 1e-6)));
  killSession();
  clearFutureStrikes(vnow());
  P.playing = false; P.nextPass = null;
  syncButtons();
}

function stopAll() {
  pause();
  P.paused = 0;
  setActive(null);
  strip.scrollTo({ left: 0, behavior: 'smooth' });
}

function togglePlay() { if (P.playing) pause(); else play(P.paused); }

function liveHit(side) {
  ensureAudio();
  if (!samplesLoaded) { samplesReady.then(() => liveHit(side)); return; }
  const t = ctx.currentTime + 0.07;
  stroke(side === 'L' ? '쿵' : '덕', t, 0.3, liveBus);
}

/* ═════════ 9. 악보줄 (정간 칸 + 장단 기호) ═════════ */
const SYMBOL = {
  '쿵': '<circle cx="20" cy="20" r="13"/>',
  '덩': '<circle cx="20" cy="20" r="13"/><line x1="20" y1="3" x2="20" y2="37"/>',
  '덕': '<line x1="20" y1="4" x2="20" y2="36"/>',
  '따': '<line x1="20" y1="4" x2="20" y2="36"/>',
  '더': '<line x1="20" y1="12" x2="20" y2="28"/>',
  '기덕': '<line x1="12" y1="9" x2="12" y2="31" stroke-dasharray="3 4"/><line x1="24" y1="4" x2="24" y2="36"/>',
  '더러러러': '<path d="M20 3 q7 4 0 8.5 t0 8.5 t0 8.5 t0 8.5"/>'
};
const symbolSvg = k => `<svg viewBox="0 0 40 40" aria-hidden="true">${SYMBOL[k]}</svg>`;

const strip = $('strip');
let activeCell = null;

function renderStrip() {
  strip.innerHTML = '';
  activeCell = null;
  if (!TL.events.length) {
    const p = document.createElement('span');
    p.className = 'empty';
    p.textContent = '편집에서 구음을 입력하세요';
    strip.appendChild(p);
  }
  let box = null;
  for (const c of TL.cells) {
    if (c.cycleStart || !box) { box = document.createElement('div'); box.className = 'jd'; strip.appendChild(box); }
    const el = document.createElement('div');
    el.className = 'jc' + (c.beatStart && !c.cycleStart ? ' bs' : '') + (c.acc ? ' acc' : '');
    // 셈여림은 크기로: 작게 = 작고 옅게, 크게 = 크게
    const DYN_CLS = { '-1': ' soft', '0': '', '1': ' loud' };
    const sy = document.createElement('div');
    sy.className = 'sy' + (c.units.length > 1 ? ' two' : '');
    sy.innerHTML = c.units.map(u => symbolSvg(u.k).replace('<svg ', `<svg class="${DYN_CLS[u.dyn]}" `)).join('');
    const lb = document.createElement('div');
    const label = c.units.map(u => u.k).join('');
    lb.className = 'lb' + (label.length > 2 ? ' long' : '');
    if (!label) lb.textContent = ' ';
    for (const u of c.units) {
      const sp = document.createElement('span');
      sp.className = DYN_CLS[u.dyn].trim();
      sp.textContent = u.k;
      lb.appendChild(sp);
    }
    el.append(sy, lb);
    el._cell = c; c.el = el;
    box.appendChild(el);
  }
  strip.scrollLeft = 0;
  syncSlider();
}

const slider = $('stripSlider');
let drag = null, userScrollT = -1e9;
const maxScroll = () => Math.max(0, strip.scrollWidth - strip.clientWidth);
const userScrolling = () => drag !== null || performance.now() - userScrollT < 2500;

function syncSlider() {
  const m = maxScroll();
  slider.hidden = m <= 0;
  slider.value = m > 0 ? Math.round(strip.scrollLeft / m * 1000) : 0;
}
strip.addEventListener('scroll', syncSlider, { passive: true });
window.addEventListener('resize', syncSlider);
slider.addEventListener('input', () => {
  userScrollT = performance.now();
  strip.scrollTo({ left: slider.value / 1000 * maxScroll(), behavior: 'instant' });
});
strip.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, left: strip.scrollLeft, moved: false, id: e.pointerId };
});
strip.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 6) {
    drag.moved = true;
    strip.setPointerCapture(drag.id);
    strip.classList.add('dragging');
  }
  if (drag.moved) {
    strip.scrollTo({ left: drag.left - dx, behavior: 'instant' });
    userScrollT = performance.now();
    syncSlider();
  }
});
strip.addEventListener('pointerup', e => {
  if (!drag) return;
  const moved = drag.moved;
  drag = null;
  strip.classList.remove('dragging');
  if (moved) return;
  const el = e.target.closest('.jc');
  if (el && el._cell) playFromCell(el._cell);
});
strip.addEventListener('pointercancel', () => { drag = null; strip.classList.remove('dragging'); userScrollT = performance.now(); });
strip.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  userScrollT = performance.now();
  strip.scrollTo({ left: strip.scrollLeft + e.deltaY, behavior: 'instant' });
  syncSlider();
}, { passive: false });

function playFromCell(c) {
  userScrollT = -1e9;
  setActive(c);
  play(c.start, { noCount: true });
}

function setActive(c) {
  if (c === activeCell) return;
  if (activeCell && activeCell.el) activeCell.el.classList.remove('now');
  activeCell = c;
  const ai = c ? c.i : -1;
  for (const x of TL.cells) x.el && x.el.classList.toggle('past', ai >= 0 && x.i < ai);
  if (c && c.el) {
    c.el.classList.add('now');
    if (userScrolling()) return;
    // 칸마다 가운데로 끌어오면 빠른 장단에서 스크롤이 끝나지 않아 칸이 소리보다 늦게 보임
    // → 새 장단이 시작될 때 그 장단을 왼쪽 끝에 맞춰 한 장단씩 넘김 (다음 장단이 통째로 보임)
    const x = c.el.offsetLeft, w = strip.clientWidth; // 칸의 offsetParent = #strip
    const box = c.el.parentElement, bx = box.offsetLeft;
    const out = x < strip.scrollLeft || x + c.el.offsetWidth > strip.scrollLeft + w;
    if (box.offsetWidth <= w) {
      if (c.cycleStart || out)
        strip.scrollTo({ left: bx - parseFloat(getComputedStyle(strip).paddingLeft), behavior: 'smooth' });
    } else if (out || x + c.el.offsetWidth > strip.scrollLeft + w * 0.78)
      strip.scrollTo({ left: x - w * 0.12, behavior: 'smooth' });
  }
}

/* ═════════ 10. 화면 갱신 루프 ═════════ */
let lastT = 0;
function frame() {
  const t = vnow();
  for (const s of allStrikes) if (s.t > lastT && s.t <= t) flashHead(s.head);
  if (allStrikes.length > 400) allStrikes = allStrikes.filter(s => s.t > t - 1);
  for (const S of [sticks.L, sticks.R]) {
    while (S.strikes.length > 1 && S.strikes[1].t < t - 1) S.strikes.shift();
  }
  lastT = t;
  drawStick('L', t);
  drawStick('R', t);

  if (P.playing) {
    // 이어지는 장단 (휘모리 1 → 2): 반복 재생이 아니면 끝나기 조금 전에 다음 장단을 끊김 없이 예약
    const nx = !state.loop && curSong().next && state.songs.find(s => s.id === curSong().next);
    if (state.loop && !P.nextPass && ctx.currentTime > P.endT - 0.8) {
      schedulePass(0, P.endT);
      P.nextPass = { t: P.endT };
    } else if (nx && !P.nextPass && ctx.currentTime > P.endT - 0.8) {
      const spc = 60 / nx.tempo / nx.sub;
      schedulePass(0, P.endT, build(nx), spc);
      P.nextPass = { t: P.endT, song: nx, spc };
    }
    if (P.nextPass && t >= P.nextPass.t) {
      // 다음 장단으로 넘어가면 제목·악보줄을 그 장단으로 바꿈 (재생은 그대로)
      if (P.nextPass.song) { state.cur = P.nextPass.song.id; save(); refresh(true); P.spc = P.nextPass.spc; }
      P.passStart = P.nextPass.t; P.from = 0;
      P.endT = P.passStart + TL.total * P.spc;
      P.nextPass = null;
    }
    if (!P.nextPass && t >= P.endT + 0.05) {
      P.playing = false; P.paused = 0;
      P.session = null; P.dry = null;
      setActive(null);
      syncButtons();
    } else {
      const pos = currentPos(t);
      if (pos >= P.from) setActive(TL.cells[Math.floor(pos + 1e-6)] || null);
    }
  }
  requestAnimationFrame(frame);
}

/* ═════════ 11. 무대 버튼 ═════════ */
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';

/* ═════════ 12. 편집 화면 ═════════ */
function syncHeading() {
  const song = curSong();
  $('songTitle').textContent = song.title || '제목 없음';
  $('songSub').textContent = `${song.beats}박 · 빠르기 ${song.tempo}`;
}
function refresh(keepPlayback) {
  if (!keepPlayback) stopAll();
  TL = build(curSong());
  syncHeading();
  renderStrip();
  if (panelOpen()) renderEditor();
}
let lightTimer = 0;
function refreshLight() {
  clearTimeout(lightTimer);
  lightTimer = setTimeout(() => {
    if (P.playing) stopAll();
    TL = build(curSong());
    renderStrip();
  }, 250);
}

function renderEditor() {
  const song = curSong();
  const box = $('chips');
  box.innerHTML = '';
  for (const s of state.songs) {
    const b = document.createElement('button');
    b.className = 'chip' + (s.id === song.id ? ' on' : '');
    b.textContent = s.title || '제목 없음';
    b.addEventListener('click', () => selectSong(s.id));
    box.appendChild(b);
  }
  const add = document.createElement('button');
  add.className = 'chip add'; add.textContent = '+ 새 장단';
  add.addEventListener('click', newSong);
  box.appendChild(add);

  $('titleIn').value = song.title;
  const seg = $('segSub'); seg.innerHTML = '';
  for (const n of [2, 3]) {
    const b = document.createElement('button');
    b.textContent = n + '칸'; b.className = n === song.sub ? 'on' : '';
    b.addEventListener('click', () => { song.sub = n; save(); refresh(); });
    seg.appendChild(b);
  }
  const bs = $('beatsSel'); bs.innerHTML = '';
  for (let k = 2; k <= 12; k++) { const o = document.createElement('option'); o.value = k; o.textContent = k + '박'; if (k === song.beats) o.selected = true; bs.appendChild(o); }
  const pl = $('perLineSel'); pl.innerHTML = '';
  for (let k = 1; k <= 4; k++) { const o = document.createElement('option'); o.value = k; o.textContent = k + '장단'; if (k === song.perLine) o.selected = true; pl.appendChild(o); }
  $('tempo').value = song.tempo; $('tempoVal').textContent = song.tempo;

  for (const b of $('segMetro').children) b.classList.toggle('on', b.dataset.m === state.metro.mode);
  $('metroVol').value = state.metro.vol; $('metroVolVal').textContent = state.metro.vol;
  $('swCount').setAttribute('aria-checked', String(state.metro.countIn));
  $('swLoop').setAttribute('aria-checked', String(state.loop));

  renderGrid();
}

function renderGrid(focusIdx, caretEnd) {
  const song = curSong();
  const grid = $('grid');
  grid.innerHTML = '';
  if (!song.cells.length) song.cells.push('');
  const L = cycleLen(song);
  const units = song.perLine * L;
  let row = null, used = 0, num = 0;
  const closeRow = () => { if (row && used < units) { const f = document.createElement('div'); f.className = 'filler'; f.style.flex = `${units - used} 1 0`; row.appendChild(f); } };
  for (let from = 0; from < song.cells.length; from += L) {
    if (num % song.perLine === 0) {
      closeRow();
      row = document.createElement('div'); row.className = 'grow'; grid.appendChild(row); used = 0;
    }
    const to = Math.min(from + L, song.cells.length), n = to - from;
    const ms = document.createElement('div'); ms.className = 'ms';
    ms.style.flex = `${L} 1 0`;
    const lab = document.createElement('div'); lab.className = 'mnum';
    lab.textContent = `${num + 1}장단`;
    const cells = document.createElement('div'); cells.className = 'mcells';
    for (let k = from; k < to; k++) cells.appendChild(cellEl(k));
    if (n < L) { cells.style.flex = 'none'; cells.style.width = `${n / L * 100}%`; }
    ms.append(lab, cells);
    row.appendChild(ms);
    used += L; num++;
  }
  closeRow();
  if (focusIdx != null) {
    const inp = grid.querySelector(`input[data-i="${focusIdx}"]`);
    if (inp) { inp.focus(); const n = inp.value.length; inp.setSelectionRange(caretEnd ? n : 0, n); }
  }
}

function paintCell(el, text) {
  const c = parseCell(text);
  el.classList.toggle('bad', c.bad);
  el.classList.toggle('multi', (text || '').length > 2);
}

function cellEl(i) {
  const song = curSong();
  const el = document.createElement('div');
  el.className = 'cell' + (i % song.sub === 0 && i % cycleLen(song) !== 0 ? ' bs' : '');
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = song.cells[i]; inp.dataset.i = i;
  inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('aria-label', `${i + 1}번째 칸`);
  const el1 = document.createElement('span'); el1.className = 'edge l';
  const el2 = document.createElement('span'); el2.className = 'edge r';
  el.append(inp, el1, el2);
  paintCell(el, song.cells[i]);

  el1.addEventListener('mousedown', e => { e.preventDefault(); insertCell(i); });
  el2.addEventListener('mousedown', e => { e.preventDefault(); insertCell(i + 1); });
  let moveAfterIME = false;
  inp.addEventListener('focus', () => inp.select());
  inp.addEventListener('input', () => {
    const v = inp.value.replace(/\s+/g, '');
    if (v !== inp.value) inp.value = v;
    song.cells[i] = v;
    paintCell(el, v);
    save(); refreshLight();
  });
  // 한글 입력 중 Enter·스페이스·Tab을 누르면 글자가 완성된 뒤 다음 칸으로
  inp.addEventListener('compositionend', () => {
    if (!moveAfterIME) return;
    moveAfterIME = false;
    setTimeout(() => { inp.value = inp.value.replace(/\s+/g, ''); song.cells[i] = inp.value; paintCell(el, inp.value); save(); refreshLight(); goCell(i + 1); }, 0);
  });
  inp.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Tab') { moveAfterIME = true; if (e.key === 'Tab') e.preventDefault(); }
      return;
    }
    const atEnd = inp.selectionStart === inp.value.length && inp.selectionEnd === inp.value.length;
    const atStart = inp.selectionStart === 0 && inp.selectionEnd === 0;
    if (e.key === 'Enter' || e.key === ' ' || (e.key === 'Tab' && !e.shiftKey) || (e.key === 'ArrowRight' && atEnd)) {
      e.preventDefault(); goCell(i + 1);
    } else if ((e.key === 'Tab' && e.shiftKey) || (e.key === 'ArrowLeft' && atStart)) {
      e.preventDefault(); goCell(i - 1, true);
    } else if (e.key === 'Delete') {
      e.preventDefault(); inp.value = ''; song.cells[i] = ''; paintCell(el, ''); save(); refreshLight();
    } else if (e.key === 'Backspace' && inp.value === '') {
      e.preventDefault(); removeCell(i);
    } else if (e.key === 'Escape') {
      e.preventDefault(); inp.blur(); closePanel();
    }
  });
  return el;
}

function goCell(j, caretEnd) {
  const song = curSong();
  if (j < 0) return;
  if (j >= song.cells.length) { song.cells.push(''); save(); refreshLight(); renderGrid(j); return; }
  const inp = $('grid').querySelector(`input[data-i="${j}"]`);
  if (inp) { inp.focus(); if (caretEnd) { const n = inp.value.length; inp.setSelectionRange(n, n); } }
}
function insertCell(at) {
  const song = curSong();
  song.cells.splice(at, 0, '');
  if (song.over) song.over = song.over.map(k => k >= at ? k + 1 : k);
  save(); refreshLight(); renderGrid(at);
}
function removeCell(i) {
  const song = curSong();
  if (song.cells.length <= 1) return;
  song.cells.splice(i, 1);
  if (song.over) song.over = song.over.filter(k => k !== i).map(k => k > i ? k - 1 : k);
  save(); refreshLight(); renderGrid(Math.max(0, i - 1), true);
}

function selectSong(id) {
  state.cur = id; save();
  refresh();
}
function newSong() {
  const s = blankSong();
  state.songs.push(s);

$('beatsSel').addEventListener('change', () => { curSong().beats = +$('beatsSel').value; save(); refresh(); });
$('perLineSel').addEventListener('change', () => { curSong().perLine = +$('perLineSel').value; save(); refresh(true); });
$('tempo').addEventListener('input', () => { curSong().tempo = +$('tempo').value; save(); $('tempoVal').textContent = curSong().tempo; syncHeading(); });

for (const b of $('segMetro').children) b.addEventListener('click', () => { state.metro.mode = b.dataset.m; save(); renderEditor(); });
$('metroVol').addEventListener('input', () => { state.metro.vol = +$('metroVol').value; $('metroVolVal').textContent = state.metro.vol; save(); });
$('metroVol').addEventListener('change', () => { ensureAudio(); tick(ctx.currentTime + 0.02, master); });
function bindSwitch(id, get, set) {
  $(id).addEventListener('click', () => { set(!get()); save(); $(id).setAttribute('aria-checked', String(get())); });
}
bindSwitch('swCount', () => state.metro.countIn, v => { state.metro.countIn = v; });

$('btnDelete').addEventListener('click', () => {
  const s = curSong();
  if (!confirm(`'${s.title || '제목 없음'}'을(를) 지울까요?`)) return;
  state.songs = state.songs.filter(x => x.id !== s.id);
  if (PRESET_DEFS.some(d => d.id === s.id) && !state.removed.includes(s.id)) state.removed.push(s.id);
  if (!state.songs.length) state.songs.push(blankSong());
  selectSong(state.songs[0].id);
});
$('btnExport').addEventListener('click', () => {
  const data = JSON.stringify({ app: 'janggu', version: 1, songs: state.songs }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = '장구-내장단.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('btnImport').addEventListener('click', () => $('fileIn').click());
$('fileIn').addEventListener('change', async () => {
  const f = $('fileIn').files[0];
  $('fileIn').value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = (data && Array.isArray(data.songs) ? data.songs : []);
    let n = 0;
    for (const s of list) {
      if (!Array.isArray(s.cells) || typeof s.title !== 'string') continue;
      const cells = s.cells.map(c => String(c || ''));
      state.songs.push({ id: newId(), title: s.title, tempo: Math.min(160, Math.max(20, +s.tempo || 60)),
        sub: [2, 3].includes(s.sub) ? s.sub : 3,
        beats: Number.isInteger(s.beats) && s.beats >= 2 && s.beats <= 12 ? s.beats : 4,
        perLine: Math.min(4, Math.max(1, +s.perLine || 1)), cells: cells.length ? cells : [''],
        over: Array.isArray(s.over) ? s.over.filter(Number.isInteger) : undefined });
      n++;
    }
    save();
    renderEditor();
    if (!n) alert('가져올 장단이 없어요.');
  } catch (e) {
    alert('파일을 읽지 못했어요.');
  }
});

/* ═════════ 13. 무대·키보드 연결 ═════════ */
$('btnPlay').addEventListener('click', togglePlay);
$('btnStop').addEventListener('click', stopAll);
$('btnEdit').addEventListener('click', () => panelOpen() ? closePanel() : openPanel());
$('btnFull').addEventListener('click', toggleFullscreen);
$('btnClose').addEventListener('click', closePanel);
$('btnApply').addEventListener('click', closePanel);
$('scrim').addEventListener('click', closePanel);

// 마우스·터치로 누른 버튼은 포커스를 풀어 스페이스바가 두 번 눌리지 않게 함
document.addEventListener('pointerup', e => {
  const b = e.target.closest && e.target.closest('button');
  if (b && !b.closest('.panel')) setTimeout(() => b.blur(), 0);
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') { if (e.key === 'Escape') closePanel(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (panelOpen()) { if (e.key === 'Escape') { e.preventDefault(); closePanel(); } return; }
  if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  let handled = true;
  switch (e.key) {
    case ' ': togglePlay(); break;
    case 'Home': case 'Escape': stopAll(); break;
    case 'f': case 'F': case 'ㄹ': toggleFullscreen(); break;
    case 'e': case 'E': case 'ㄷ': openPanel(); break;
    default: handled = false;
  }
  if (handled) e.preventDefault();
});

/* ═════════ 14. 시작 ═════════ */
buildJanggu();
syncButtons();
syncFullscreenIcon();
save();
refresh(true);
requestAnimationFrame(frame);
})();
</script>
</body>
